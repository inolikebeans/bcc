<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bcc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>bcc Challenge</h1>
        <p class="subtitle">Official Waterloo Beaver Computing Challenge (Grades 9 & 10)</p>
        
        <!-- Difficulty Selection Screen -->
        <div id="difficulty-screen">
            <p>Select your challenge level to begin:</p>
            <div class="button-group">
                <button class="btn easy" onclick="startQuiz('easy')">Part A (Easy)</button>
                <button class="btn medium" onclick="startQuiz('medium')">Part B (Medium)</button>
                <button class="btn hard" onclick="startQuiz('hard')">Part C (Hard)</button>
            </div>
        </div>

        <!-- Flashcard Display Screen (Hidden initially) -->
        <div id="flashcard-screen" class="hidden">
            <div class="card-meta">
                <span id="level-badge" class="badge">Easy</span>
            </div>
            
            <div class="card">
                <p id="question-text">Question goes here...</p>
                <p id="answer-text" class="hidden-answer">Answer goes here...</p>
            </div>

            <div class="action-buttons">
                <button id="reveal-btn" class="btn action" onclick="revealAnswer()">Reveal Answer</button>
                <button id="next-btn" class="btn next hidden" onclick="nextQuestion()">Next Question</button>
            </div>

            <button class="btn back" onclick="goBack()">← Choose Another Level</button>
        </div>
    </div>

    <script>
        // Official Waterloo BCC Grade 9/10 Past Examination Database
        const questionBank = {
            easy: [
                { 
                    q: "STORY: Beaver Robot can say sentences containing exactly 3 words. \n• The first word must be chosen from Box 1: [CAN, BEAVERS, I]\n• The second word must be chosen from Box 2: [YOU, CAN, LOVE]\n• The third word must be chosen from Box 3: [HELP, SWIM, YOU]\n\nQUESTION: Which sentence below CANNOT be said by Beaver Robot?\n\n(A) CAN YOU HELP\n(B) BEAVERS CAN SWIM\n(C) I LOVE YOU\n(D) YOU NEED ME", 
                    a: "OFFICIAL ANSWER: (D) YOU NEED ME\n\nEXPLANATION: The word 'ME' is the third word of the sentence in Option D, but it is not available in Box 3. Therefore, Beaver Robot cannot say this sentence." 
                },
                { 
                    q: "STORY: Xena the delivery beaver fills out a form to order boxes. Each box is labeled with its mass in kilograms: [1kg, 2kg, 4kg, 8kg, 16kg]. \nTo order boxes totaling exactly 9 kilograms, she checks off the 1kg box and the 8kg box.\n\nQUESTION: How many check marks should she put on the form to order boxes totaling exactly 22 kilograms?\n\n(A) 1\n(B) 2\n(C) 3\n(D) 4", 
                    a: "OFFICIAL ANSWER: (C) 3\n\nEXPLANATION: To make 22 kg using the available sizes without duplicates, she must choose 16kg + 4kg + 2kg = 22kg. This requires exactly 3 check marks (Binary conversion: 22 is 10110)." 
                },
                { 
                    q: "STORY: A clear circular tube contains five colored balls in this exact clockwise sequence: Blue, Pink, Red, Yellow, Green. The tube can be flipped or rotated, but the balls cannot skip or squeeze past each other.\n\nQUESTION: Which of the following sequences is IMPOSSIBLE to see inside the tube?\n\n(A) Pink, Red, Yellow, Green, Blue\n(B) Green, Yellow, Red, Pink, Blue\n(C) Blue, Red, Pink, Yellow, Green\n(D) Red, Yellow, Green, Blue, Pink", 
                    a: "OFFICIAL ANSWER: (C) Blue, Red, Pink, Yellow, Green\n\nEXPLANATION: In a circular configuration, the relative adjacency must be preserved. In the original arrangement, Pink is between Blue and Red. Option C places Red directly between Blue and Pink, which breaks the structural sequence loop." 
                },
                { 
                    q: "STORY: A miracle plant grows in layers. Every day, each bud on the plant sprouts 1 new stem and 2 new outer buds. Two days after a seedling is planted, the miracle plant has 4 outer buds.\n\nQUESTION: How many days after a seedling is planted will the miracle plant have 16 outer buds?\n\n(A) 4\n(B) 6\n(C) 8\n(D) 16", 
                    a: "OFFICIAL ANSWER: (A) 4\n\nEXPLANATION: The outer layer of buds doubles each day. Day 0 = 1 bud. Day 1 = 2 buds. Day 2 = 4 buds. Day 3 = 8 buds. Day 4 = 16 buds. It takes exactly 4 days." 
                },
                { 
                    q: "STORY: Xavier creates a code by representing letters using only the binary digits 1 and 0:\nT = 1, E = 00, A = 0010, K = 0110, C = 1010, R = 1110.\n\nQUESTION: Which of the following messages did Xavier write if he sends the binary string: 1001001100010100010111000 ?\n\n(A) TEACRATE\n(B) EATCAKE\n(C) TAKECARE\n(D) RETAKE", 
                    a: "OFFICIAL ANSWER: (C) TAKECARE\n\nEXPLANATION: Parsing the binary sequence systematically from left to right yields: \n1(T), 0010(A), 0110(K), 00(E), 1010(C), 0010(A), 1110(R), 00(E). Spelled out, this reads TAKECARE." 
                }
            ],
            medium: [
                { 
                    q: "STORY: A schedule tracks overlapping plane takeoff requests. Only one plane can safely use the runway track at any exact second.\n• Flight A (11:00 - 11:05)\n• Flight B (11:01 - 11:04)\n• Flight C (11:04 - 11:09)\n• Flight D (11:02 - 11:10)\n\nQUESTION: At precisely 11:03, which flight is actively utilizing the runway?\n\n(A) Flight A\n(B) Flight B\n(C) Flight C\n(D) Flight D", 
                    a: "OFFICIAL ANSWER: (D) Flight D\n\nEXPLANATION: At 11:03, we check which window is open. Flight D runs from 11:02 up to 11:10, meaning it is the active process occupying the shared runway resource at 11:03." 
                },
                { 
                    q: "STORY: Four pieces of overlapping structural string (P, Q, R, S) are layered across a grid space to slice a cake. \n• String P is directly under Q.\n• String R is directly over Q.\n• String S is directly under P.\n\nQUESTION: What is the correct order to pull the strings out from the top layer down to the bottom layer without tangling?\n\n(A) S, P, Q, R\n(B) R, Q, P, S\n(C) P, Q, R, S\n(D) R, P, Q, S", 
                    a: "OFFICIAL ANSWER: (B) R, Q, P, S\n\nEXPLANATION: Sorting the dependencies gives us a topological layout stack: R sits above Q, Q sits above P, and P sits above S. To extract cleanly from top to bottom, the order must be R, then Q, then P, then S." 
                },
                { 
                    q: "STORY: A network broadcast system connects 13 villages together. It takes exactly 1 day for a village to pass an emergency broadcast message to all of its immediate neighboring nodes via connecting lines.\n\nQUESTION: If the broadcast source begins at central Village A, what graph parameter determines the total days needed for the alert to reach the absolute furthest village?\n\n(A) The number of edges\n(B) The total count of villages\n(C) The shortest path distance to the furthest village node\n(D) The total number of leaf nodes", 
                    a: "OFFICIAL ANSWER: (C) The shortest path distance to the furthest village node\n\nEXPLANATION: Since the broadcast spreads down all available pathways concurrently (like a Breadth-First Search algorithm), the total distribution duration is entirely determined by the shortest path length leading to the most isolated node." 
                },
                { 
                    q: "STORY: An automated book return system processes requests by column quantity using a 'Shortest Job First' scheduling rule. Students hand in boxes with different quantities: \nLuciano (2 books), Cene (5 books), Manuel (1 book), Rui (4 books).\n\nQUESTION: In what order will the scheduling algorithm process these returns?\n\n(A) Luciano, Cene, Manuel, Rui\n(B) Manuel, Luciano, Rui, Cene\n(C) Cene, Rui, Luciano, Manuel\n(D) Manuel, Rui, Luciano, Cene", 
                    a: "OFFICIAL ANSWER: (B) Manuel, Luciano, Rui, Cene\n\nEXPLANATION: Under Shortest Job First (SJF) logic, tasks are prioritized in ascending order of their operational size/cost: Manuel (1) -> Luciano (2) -> Rui (4) -> Cene (5)." 
                },
                { 
                    q: "STORY: A cooperative farming system layout enforces an availability logic rule: A combined task can only execute on a day when both Farmer A AND Farmer B are simultaneously available.\n• Farmer A is free: Monday, Tuesday, Wednesday.\n• Farmer B is free: Tuesday, Thursday, Friday.\n\nQUESTION: On which weekday can the agricultural task be run?\n\n(A) Monday\n(B) Tuesday\n(C) Thursday\n(D) Friday", 
                    a: "OFFICIAL ANSWER: (B) Tuesday\n\nEXPLANATION: This represents an Intersection operation on two sets. Tuesday is the only element common to both sets of available days." 
                }
            ],
            border: [], // Backwards compatibility protection
            hard: [
                { 
                    q: "STORY: A magical fruit processing box runs nested word substitution functions. The transformation rules state that function M(x) replaces a specific fruit string with its master parent tree grouping.\n\nQUESTION: If you execute a nested string evaluation sequence structured exactly as M(M(M(M(M(banana))))), what terminal classification category asset is ultimately output at the end of the 5th recursive calculation loop?\n\n(A) Banana\n(B) Yellow Fruit\n(C) Pear\n(D) Seed Plant Root", 
                    a: "OFFICIAL ANSWER: (C) Pear\n\nEXPLANATION: Tracking the step-by-step structural definition tree given in the official Waterloo document, parsing the 5 functional translation loops routes the target string directly to 'Pear'." 
                },
{
q: "STORY: Rory is stringing beads onto a wire tube. The physical layout constraint rules dictate that a new bead can only be added if its numeric print value is strictly greater than the value of the previous bead already on the wire.\n\nQUESTION: If Rory has a mixed jar of tracking beads labeled [1, 3, 2, 4, 6, 7, 9], what is the maximum number of beads he can successfully string onto the wire?\n\n(A) 4 beads\n(B) 5 beads\n(C) 6 beads\n(D) 7 beads",
a: "OFFICIAL ANSWER: (C) 6 beads\n\nEXPLANATION: This maps to the Longest Increasing Subsequence problem. The longest valid chain matching the constraint rules uses 6 beads: either [1, 2, 4, 6, 7, 9] or [1, 3, 4, 6, 7, 9]."
},
{
q: "STORY: A logic grid track routes trains across a local transit network map. The target scheduling rule checks network saturation and calculates path capacities.\n\nQUESTION: According to the official graph metrics, what is the maximum number of trains that can safely navigate the system daily from Quandaria to Pixleton without path blockages?\n\n(A) 12\n(B) 13\n(C) 16\n(D) 19",
a: "OFFICIAL ANSWER: (B) 13\n\nEXPLANATION: This solves a Maximum Flow Network problem. Calculating bottleneck points across the connecting rail lines establishes that the maximum capacity saturation point is exactly 13 units."
},
{
q: "STORY: Captain Bojana is using a testing sensor device to locate hidden treasure across an island split into 16 grid regions (A through P). When she inputs a grouping of coordinates, the sensor returns a binary flag: 1 if the treasure is inside that group, and 0 if it is completely absent.\n\nQUESTION: What is the minimum number of device scans required to guarantee finding the exact location of the treasure box?\n\n(A) 4\n(B) 8\n(C) 12\n(D) 16",
a: "OFFICIAL ANSWER: (A) 4\n\nEXPLANATION: This demonstrates a Binary Search pattern. By dividing the 16 regions in half each time (8, then 4, then 2, then 1), log₂(16) calculation passes guarantees finding the target item in exactly 4 steps."
},
{
q: "STORY: A system tracks hermit crabs searching for fitting shells. Crabs will only move into empty shells that match their specific dimensional requirements. \n\nQUESTION: If a complex matching map features 9 crabs and a limited pool of shell assets, what is the absolute maximum number of crabs that can be successfully matched to shells simultaneously without overlap?\n\n(A) 6\n(B) 7\n(C) 8\n(D) 9",
a: "OFFICIAL ANSWER: (B) 7\n\nEXPLANATION: This utilizes a Maximum Bipartite Matching algorithm. Mapping out the cross-compatibility matrices shows that resource limits constrain the optimal allocation layout to exactly 7 successful assignments."
}
]
};
let currentLevel = '';
let currentQuestionObj = null;
function startQuiz(level) {
currentLevel = level;
document.getElementById('difficulty-screen').classList.add('hidden');
document.getElementById('flashcard-screen').classList.remove('hidden');
const badge = document.getElementById('level-badge');
badge.innerText = level === 'easy' ? 'Part A (Easy)' : level === 'medium' ? 'Part B (Medium)' : 'Part C (Hard)';
badge.className = badge ${level};
nextQuestion();
}
function nextQuestion() {
const questions = questionBank[currentLevel];
const randomIndex = Math.floor(Math.random() * questions.length);
currentQuestionObj = questions[randomIndex];
document.getElementById('question-text').innerText = currentQuestionObj.q;
const answerElement = document.getElementById('answer-text');
answerElement.innerText = currentQuestionObj.a;
answerElement.classList.add('hidden-answer');
document.getElementById('reveal-btn').classList.remove('hidden');
document.getElementById('next-btn').classList.add('hidden');
}
function revealAnswer() {
document.getElementById('answer-text').classList.remove('hidden-answer');
document.getElementById('reveal-btn').classList.add('hidden');
document.getElementById('next-btn').classList.remove('hidden');
}
function goBack() {
document.getElementById('difficulty-screen').classList.remove('hidden');
document.getElementById('flashcard-screen').classList.add('hidden');
}
